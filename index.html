<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Key Expired</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#0d0d0d;
      overflow:hidden;
      color:white;
    }

    .bg{
      position:absolute;
      width:100%;
      height:100%;
      background:
      radial-gradient(circle at top left,#ff000055,transparent 30%),
      radial-gradient(circle at bottom right,#0066ff55,transparent 30%);
      filter:blur(40px);
    }

    .card{
      position:relative;
      width:90%;
      max-width:500px;
      padding:40px;
      border-radius:25px;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 30px rgba(0,0,0,0.5);
      text-align:center;
      animation:fade 1s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(20px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .title{
      font-size:32px;
      font-weight:bold;
      color:#ff3c3c;
      margin-bottom:15px;
      text-shadow:0 0 15px #ff0000;
    }

    .subtitle{
      font-size:16px;
      color:#cccccc;
      margin-bottom:35px;
      line-height:1.6;
    }

    .social-title{
      font-size:18px;
      margin-bottom:20px;
      color:#ffffff;
      letter-spacing:1px;
    }

    .socials{
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .btn{
      text-decoration:none;
      padding:14px;
      border-radius:15px;
      font-weight:bold;
      transition:0.3s;
      color:white;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.08);
    }

    .btn:hover{
      transform:scale(1.05);
      background:#ffffff22;
      box-shadow:0 0 15px rgba(255,255,255,0.2);
    }

    .youtube:hover{
      box-shadow:0 0 20px red;
    }

    .tiktok:hover{
      box-shadow:0 0 20px cyan;
    }

    .discord:hover{
      box-shadow:0 0 20px #5865F2;
    }

    .footer{
      margin-top:30px;
      font-size:12px;
      color:#888;
    }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="card">

    <div class="title">
      KEY FREE HAS BEEN EXPIRED
    </div>

    <div class="subtitle">
      WAIT UNTIL UPDATE AGAIN
    </div>

    <div class="social-title">
      JOIN MY SOCIAL MEDIA
    </div>

    <div class="socials">

      <a href="https://youtube.com/"
         class="btn youtube"
         target="_blank">
         YOUTUBE LINK
      </a>

      <a href="https://tiktok.com/"
         class="btn tiktok"
         target="_blank">
         TIKTOK LINK
      </a>

      <a href="https://discord.gg/"
         class="btn discord"
         target="_blank">
         DISCORD COMMUNITY LINK
      </a>

    </div>

    <div class="footer">
      © 2026 ALL RIGHTS RESERVED
    </div>

  </div>

</body>
</html>
